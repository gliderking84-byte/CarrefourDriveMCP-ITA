# The HTTP server, reachable through a Cloudflare Tunnel (no port opened on the router).
#
# 1. Copy .env.example to .env and set PUBLIC_URL, MCP_OWNER_PASSPHRASE
#    (and MCP_API_TOKEN for a PWA backend), plus TUNNEL_TOKEN for cloudflared.
# 2. docker compose up -d
# 3. In Cloudflare Zero Trust > Networks > Tunnels, route your hostname
#    (e.g. mcp.example.com) to http://carrefour:3000.
#
# Without Cloudflare, drop the cloudflared service and publish the port
# instead ("ports: ['127.0.0.1:3000:3000']") behind your own HTTPS proxy.

services:
  carrefour:
    build: .
    image: carrefour-it-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      MCP_TRANSPORT: http
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - carrefour-data:/data
    shm_size: 1gb # Chromium needs more shared memory than Docker's 64 MB default

  cloudflared:
    image: cloudflare/cloudflared:latest # pin a version from hub.docker.com/r/cloudflare/cloudflared if you prefer
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - carrefour

volumes:
  carrefour-data:
